name: Legal Clarity CI & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-and-security:
    name: Backend Tests, Typing & SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install mypy pytest pytest-cov pytest-asyncio pip-audit

      - name: Strict Type Checking (mypy)
        run: |
          mypy backend/

      - name: Run Backend Tests & Coverage
        run: |
          pytest --cov=app --cov-report=term --cov-report=xml

      - name: Python Vulnerability Audit (pip-audit)
        run: |
          pip-audit

      - name: Execute Adversarial Grounding Benchmark
        run: |
          python benchmarks/run_benchmark.py

  frontend-quality-and-security:
    name: Frontend Tests, Build & SAST
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: Run Frontend Component Tests (Vitest)
        run: |
          npm test

      - name: Build Production Bundle
        run: |
          npm run build

      - name: Dependency Security Audit (npm audit)
        run: |
          npm audit --audit-level=high
